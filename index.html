<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stress Relief Zone</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #a1c4fd, #c2e9fb);
}
section {
  margin: 30px;
  padding: 20px;
  background: white;
  border-radius: 15px;
}
button {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🌿 Stress Relief Zone</h1>

<!-- VIDEO -->
<section>
<h2>🎥 Relax Video</h2>
<iframe width="300" height="200"
src="https://www.youtube.com/embed/1ZYbU82GVz4"
allowfullscreen></iframe>
</section>

<!-- MUSIC -->
<section>
<h2>🎵 Calm Music</h2>
<audio controls>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>
</section>

<!-- GAME -->
<section>
<h2>🎮 Mini Game</h2>
<p>Click the button!</p>
<button onclick="alert('Good job! 😊 Relaxed!')">Click me</button>
</section>

<!-- CHAT (simple fake chat) -->
<section>
<h2>💬 Chat</h2>
<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>
<p id="chat"></p>
</section>

<script>
function send(){
let m = document.getElementById("msg").value;
document.getElementById("chat").innerHTML += "🧡 " + m + "<br>";
}
</script>

</body>
</html>
